<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brain Tumor Classification System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="main-container">

    <!-- ===========================
            HEADER
    ============================ -->

    <header>

        <div class="header-top">

            <div class="title-section">

                <h1>🧠 Brain Tumor Classification System</h1>

                <p>
                    AI-Powered Brain MRI Analysis using Deep Learning
                </p>

            </div>

            <div class="theme-switch">

                <span id="themeLabel">🌙 Dark</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="themeToggle">

                    <span class="slider"></span>

                </label>

            </div>

        </div>

    </header>

    <!-- ===========================
            MAIN CONTENT
    ============================ -->

    <div class="content">

        <!-- ===========================
                LEFT CARD
        ============================ -->

        <div class="upload-card">

            <h2>Upload MRI Scan</h2>

            <form
                id="uploadForm"
                enctype="multipart/form-data">

                <div id="drop-area">

                    <p>Drag & Drop MRI Image Here</p>

                    <span>OR</span>

                    <button
                        type="button"
                        id="browseButton">

                        Browse Image

                    </button>

                    <input
                        type="file"
                        id="imageInput"
                        name="image"
                        accept="image/png,image/jpeg,image/jpg"
                        hidden>

                </div>

                <div class="preview-container">

                    <img
                        id="previewImage"
                        src=""
                        alt="MRI Preview">

                </div>

                <div class="button-group">

                    <button
                        type="submit"
                        id="predictButton"
                        disabled>

                        Analyze MRI

                    </button>

                    <button
                        type="button"
                        id="clearButton">

                        Clear

                    </button>

                </div>

            </form>

        </div>

        <!-- ===========================
                RIGHT CARD
        ============================ -->

        <div class="result-card">

            <h2>Prediction Result</h2>

            <div id="status">

                Waiting for MRI image...

            </div>

            <div id="prediction">

                <p>Tumor Type</p>

                <h3>--</h3>

            </div>

            <div id="confidence">

                <p>Confidence</p>

                <h3>-- %</h3>

            </div>

            <div class="progress">

                <div id="confidenceBar"></div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
